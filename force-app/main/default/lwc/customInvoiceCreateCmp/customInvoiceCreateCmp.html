<template>
    <template if:true={loaded}>
        <c-wave-loader></c-wave-loader>
    </template>
    <div style="background-color: white;">
        <div class="custom-header slds-p-around_medium">
            <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-text-align_center">
                    <div class="slds-grid slds-grid_align-center slds-wrap">
                        <div>
                            <h1 class="slds-text-heading_large slds-text-color_inverse">Create. Invoice. Collect.</h1>
                            <p class="slds-text-body_regular">Fast, accurate invoices your customers trust</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="slds-m-around_medium">
            <template if:true={isFirstStep}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input label="Invoice Name" value={invoiceName} onchange={handleInputChange} data-field="invoiceName" required></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input label="Expiration Date" type="date" value={expirationDate} onchange={handleInputChange} data-field="expirationDate" required></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox label="Status" value={status} options={statusOptions} onchange={handleInputChange} data-field="status" required></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input label="Tax" type="number" value={tax} onchange={handleInputChange} data-field="tax"></lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-m-top_medium">
                        <h2 class="slds-text-heading_medium">Address Information</h2>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-2">
                                <h3 class="slds-text-heading_small">Bill To</h3>
                                <lightning-input-address
                                    address-label="Address"
                                    street-label="Street"
                                    city-label="City"
                                    country-label="Country"
                                    province-label="Province"
                                    postal-code-label="PostalCode"
                                    street={billingAddress.street}
                                    city={billingAddress.city}
                                    province={billingAddress.province}
                                    postal-code={billingAddress.postalCode}
                                    country={billingAddress.country}
                                    country-options={countryOptions}
                                    province-options={billingProvinceOptions}
                                    onchange={handleBillToAddressChange}
                                    show-address-lookup>
                                </lightning-input-address>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <h3 class="slds-text-heading_small">Ship To</h3>
                                <lightning-input-address
                                    address-label="Address"
                                    street-label="Street"
                                    city-label="City"
                                    country-label="Country"
                                    province-label="Province"
                                    postal-code-label="PostalCode"
                                    street={shippingAddress.street}
                                    city={shippingAddress.city}
                                    province={shippingAddress.province}
                                    postal-code={shippingAddress.postalCode}
                                    country={shippingAddress.country}
                                    country-options={countryOptions}
                                    province-options={shippingProvinceOptions}
                                    onchange={handleShipToAddressChange}
                                    show-address-lookup>
                                </lightning-input-address>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <template if:true={isThirdStep}>
                <c-invoice-edit-cmp lwc:ref="quoteForm" record-id={currentLayoutId} invoice-id={activeInvoiceId} mode={isEditable} is-from-quote={isFromQuote}></c-invoice-edit-cmp>
            </template>

            <template if:true={isEmailModalOpen}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <c-email-lwc record-id={activeInvoiceId} onclosemodal={handleCloseModal}></c-email-lwc>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <template if:true={isModalVisible}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                            <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCloseModalPdf}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                        </header>
                        <div class="slds-modal__content" style="height:70vh;">
                            <iframe src={iframeSourceUrl} width="100%" height="100%" style="border:none;"></iframe>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral" label="Close" onclick={handleCloseModalPdf}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </div>

        <template if:true={successMessage}>
            <div class="slds-text-color_success slds-m-top_small">{successMessage}</div>
        </template>
        <template if:true={errorMessage}>
            <div class="slds-text-color_error slds-m-top_small">{errorMessage}</div>
        </template>

        <footer class="slds-grid slds-grid_align-center slds-p-top_medium slds-p-bottom_medium slds-text-align_center" style="background-color: #f4f6f9;">
            <div class="slds-col slds-size_1-of-1 slds-text-align_center">
                <div class="slds-m-bottom_small">
                    <button class="custom-cancel-button" onclick={handleCancel}>Cancel</button>

                    <template if:true={isThirdStep}>
                        <button class="custom-button slds-m-left_small slds-m-bottom_small" onclick={handleSecondPrevious}>Previous</button>
                        <button class="custom-button slds-m-bottom_small slds-m-left_small" onclick={handleSave}>Save</button>
                        <button class="custom-button slds-m-bottom_small slds-m-left_small" onclick={handleOpenModalPdf}>Preview PDF</button>
                        <button class="custom-button slds-m-bottom_small slds-m-left_small" onclick={handleOpenModal}>Send Mail</button>
                    </template>

                    <template if:true={isFirstStep}>
                        <button class="custom-button saveNnext-button slds-m-left_small" onclick={saveAndNext}>Save & Next</button>
                    </template>
                </div>
                <p class="slds-text-body_regular slds-p-top_x-small">Copyright 2025 NSIQ INFOTECH PVT. LTD. - Salesforce Development Company. All rights reserved.</p>
            </div>
        </footer>
    </div>
</template>
